<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>さまぁ配信タイマー</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Arial Rounded MT Bold", "Yu Gothic", "Meiryo", sans-serif;
  }

  #timer {
    display: inline-block;
    padding: 8px 24px;
    border-radius: 999px;
    border: 3px solid rgba(255,255,255,.95);

    color: #ffffff;
    font-size: 58px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: .04em;

    background: linear-gradient(135deg, rgba(255,120,205,.95), rgba(255,190,235,.92));
    box-shadow:
      0 0 8px rgba(255,255,255,.95),
      0 0 18px rgba(255,105,180,.95),
      0 0 32px rgba(255,180,235,.85);

    text-shadow:
      0 2px 0 rgba(190,45,135,.85),
      0 0 8px rgba(255,255,255,.95);
    white-space: nowrap;
  }

  .sparkle {
    color: #fff;
    text-shadow:
      0 0 8px #fff,
      0 0 16px #ff8fd3;
  }
</style>
</head>

<body>
  <div id="timer">
    <span class="sparkle">♡</span> 00:00:00 <span class="sparkle">♡</span>
  </div>

<script>
  let seconds = 0;
  let interval = null;

  function updateDisplay() {
    const h = String(Math.floor(seconds / 3600)).padStart(2, "0");
    const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, "0");
    const s = String(seconds % 60).padStart(2, "0");

    document.getElementById("timer").innerHTML =
      `<span class="sparkle">♡</span> ${h}:${m}:${s} <span class="sparkle">♡</span>`;
  }

  function startTimer() {
    if (interval) return;
    interval = setInterval(() => {
      seconds++;
      updateDisplay();
    }, 1000);
  }

  function pauseTimer() {
    clearInterval(interval);
    interval = null;
  }

  function resetTimer() {
    clearInterval(interval);
    interval = null;
    seconds = 0;
    updateDisplay();
  }

  document.addEventListener("keydown", (e) => {
    const key = e.key.toLowerCase();
    if (key === "s") startTimer();
    if (key === "p") pauseTimer();
    if (key === "r") resetTimer();
  });

  updateDisplay();
</script>
</body>
</html>
